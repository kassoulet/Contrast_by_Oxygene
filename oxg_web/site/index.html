<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONTRAST (Oxygene, 1996) in JavaScript</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #bbb; font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  #wrap { position: relative; width: min(100vw, calc((100vh - 60px) * 4 / 3)); aspect-ratio: 4 / 3; background: #000; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #start { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; background: rgba(0,0,0,.72); cursor: pointer; text-align: center; padding: 16px; }
  #start b { font-size: 1.4em; color: #fff; letter-spacing: .1em; }
  #info { max-width: 720px; padding: 0 16px; font-size: 12px; color: #888; text-align: center; }
  #credits { position: absolute; inset: 0; display: none; padding: 6%; box-sizing: border-box; background: #000; color: #ddd; white-space: pre; font-size: clamp(8px, 1.9vw, 16px); }
  a { color: #8ab; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen" width="320" height="200"></canvas>
  <pre id="credits"></pre>
  <div id="start"><b>CONTRAST</b><span>a demo by OXYGENE (1996), run from its original data by a JavaScript port.<br>Click to start (sound on).</span><span id="status">loading&hellip;</span></div>
</div>
<div id="info">320&times;200 stretched to 4:3, 70&nbsp;Hz ticks. F: fullscreen &middot; P: pause. Needs <code>assets/CONTRAST.BIN</code> (the demo's data archive).</div>
<script src="oxg.js"></script>
<script src="player.js"></script>
</body>
</html>
